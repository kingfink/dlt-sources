[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailor-made-dlt-sources"
version = "0.2.0"
description = "Reusable dlt sources for personal data pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "dlt>=1.5,<2",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "duckdb>=1.0",
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.15.22",
]

[project.urls]
Repository = "https://github.com/kingfink/dlt-sources"

[tool.hatch.build.targets.wheel]
packages = ["tailor_made_dlt_sources"]

[tool.hatch.build.targets.sdist]
exclude = ["sources", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
