name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify release metadata
        run: python3 scripts/release_metadata.py verify "${{ inputs.tag }}"

      - name: Check lockfile
        run: uv lock --check

      - name: Compile Python files
        run: git ls-files '*.py' -z | xargs -0 python3 -m py_compile

      - name: Check dlt init layout
        run: python3 scripts/sync_dlt_init_layout.py --check

      - name: Run tests
        run: uv run --frozen --extra dev pytest -q

      - name: Check linting
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.16
          args: check --output-format=github .

      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.16
          args: format --check .

      - name: Build package
        run: uv build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh "${{ inputs.tag }}"
